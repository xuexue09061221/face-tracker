<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人脸追踪 · 战力检测仪</title>
<style>
  :root{--bg:#0f1222;--card:#1a1f38;--ink:#eef0ff;--sub:#9aa3c7;--accent:#6366f1;--line:#2a3050}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(1200px 600px at 20% -10%,#2a2f66 0%,var(--bg) 55%);color:var(--ink);min-height:100vh;padding-bottom:70px}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:rgba(15,18,34,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 18px}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#a855f7);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
  .brand b{font-size:1.08rem}
  .brand small{display:block;color:var(--sub);font-size:.72rem}
  #status{margin-left:auto;font-size:.8rem;color:var(--sub);text-align:right;max-width:44%}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  .stage{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 10px 40px rgba(0,0,0,.45);border:1px solid var(--line)}
  #cam{width:100%;height:100%;object-fit:contain;display:block}
  #placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#5a6287;font-size:.95rem;text-align:center;padding:20px}
  #placeholder .big{font-size:2.6rem}
  .badge{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.55);color:#cffcdf;padding:4px 12px;border-radius:99px;font-size:.78rem;display:none;border:1px solid rgba(34,197,94,.4)}
  #powerCard{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(10,12,26,.78);backdrop-filter:blur(8px);border-radius:14px;padding:8px 16px 12px;text-align:center;display:none;min-width:190px;border:1px solid rgba(255,255,255,.12)}
  #powerCard .ptitle{font-size:.72rem;color:var(--sub);letter-spacing:2px}
  #powerCard .prow{display:flex;align-items:baseline;justify-content:center;gap:8px}
  #powerCard .pnum{font-size:2.2rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
  #powerCard .tier{font-size:.95rem;font-weight:700}
  #powerCard .pdesc{font-size:.7rem;color:var(--sub);margin-top:2px}
  #powerCard .pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
  #powerCard .pfill{height:100%;width:0%;border-radius:99px;transition:width .15s linear}
  #powerCard.scan .pnum{animation:pulse .5s infinite}
  @keyframes pulse{50%{opacity:.45}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
  .btn{border:1px solid var(--line);background:#232946;color:var(--ink);padding:9px 15px;border-radius:10px;font-size:.88rem;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{filter:brightness(1.15)}
  .btn.green{background:linear-gradient(135deg,#16a34a,#22c55e);border:none;color:#fff;font-weight:600}
  .btn.red{background:linear-gradient(135deg,#dc2626,#ef4444);border:none;color:#fff}
  .btn.violet{background:linear-gradient(135deg,var(--accent),#a855f7);border:none;color:#fff}
  label.ctl{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--sub)}
  select,input[type=checkbox]{accent-color:var(--accent)}
  select{background:#232946;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:.85rem}
  .legend{background:#141830;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:.8rem}
  .legend h4{font-size:.85rem;margin-bottom:8px;color:var(--ink)}
  .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
  .lgrid div{display:flex;align-items:center;gap:6px}
  .lcolor{width:10px;height:10px;border-radius:3px;flex:none}
  .lname{font-weight:600}
  .lrange{color:var(--sub);margin-left:auto}
  .hint{color:var(--sub);font-size:.76rem;line-height:1.6;background:#141830;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px}
  @media(max-width:640px){.panel{gap:8px 12px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">👊</div>
  <div class="brand"><b>人脸追踪 · 战力检测仪</b><small>识别人脸 · 自动追踪 · 评定战斗力 1~100</small></div>
  <div id="status">未开启</div>
</header>

<main class="wrap">
  <div class="stage" id="stage">
    <canvas id="cam"></canvas>
    <div id="placeholder"><div class="big">📷</div>点击下方「开启摄像头」开始<br><span style="font-size:.78rem;color:#454d70">需允许浏览器使用摄像头权限</span></div>
    <div class="badge" id="badge"></div>
    <div id="powerCard">
      <div class="ptitle">⚡ 战斗力量测 ⚡</div>
      <div class="prow"><span class="pnum" id="pnum">0</span><span class="tier" id="ptier">--</span></div>
      <div class="pdesc" id="pdesc"></div>
      <div class="pbar"><div class="pfill" id="pfill"></div></div>
    </div>
  </div>

  <div class="panel">
    <button class="btn green" id="btnStart">▶ 开启摄像头</button>
    <button class="btn red" id="btnStop" style="display:none">■ 关闭</button>
    <button class="btn violet" id="btnShot">📸 拍照</button>
    <button class="btn" id="btnFs">⛶ 全屏</button>
    <label class="ctl">摄像头
      <select id="selCam"><option value="user">前置</option><option value="environment">后置</option></select>
    </label>
    <label class="ctl">画质
      <select id="selRes">
        <option value="640x480">流畅 640×480</option>
        <option value="1280x720" selected>高清 1280×720</option>
        <option value="1920x1080">超清 1920×1080</option>
      </select>
    </label>
    <label class="ctl"><input type="checkbox" id="ckMirror" checked> 镜像</label>
    <label class="ctl"><input type="checkbox" id="ckFollow"> 🎯 自动追踪</label>
    <label class="ctl"><input type="checkbox" id="ckPower" checked> 👊 战力扫描</label>
    <label class="ctl" id="zoomWrap" style="display:none">追踪强度
      <select id="selZoom"><option value="1.4">1.4×</option><option value="1.8" selected>1.8×</option><option value="2.4">2.4×</option></select>
    </label>
  </div>

  <div class="legend">
    <h4>📊 战斗力等级表（1 ~ 100）</h4>
    <div class="lgrid" id="legendGrid"></div>
  </div>

  <div class="hint">
    💡 <b>玩法：</b>对准人脸，仪器会自动判定该目标的战斗力（同一个人数值稳定，换人重新判定；靠近镜头会略微涨战力 😏）。需 <b>https</b> 环境（GitHub Pages 已满足）；微信里打不开摄像头请点 ⋯ →「在浏览器打开」。
  </div>
</main>

<script>
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('cam'),ctx=canvas.getContext('2d');
const video=document.createElement('video');video.muted=true;video.playsInline=true;video.autoplay=true;
let detector=null,stream=null,camOn=false,raf=0,lastDetect=0,lastPower=0;
let faces=[],tracks=[],smooth={x:.5,y:.5},idSeq=1,frameN=0;

const st={facing:'user',res:'1280x720',mirror:true,follow:false,zoom:1.8,power:true};

/* 战力等级 */
const TIERS=[
 {min:1,max:14,name:'纯真天使',desc:'人畜无害，可放心贴贴',emoji:'😇',color:'#34d399'},
 {min:15,max:32,name:'软萌新人',desc:'战力约等于零，但很可爱',emoji:'🐣',color:'#2dd4bf'},
 {min:33,max:50,name:'普通同学',desc:'日常状态，人畜无害',emoji:'🙂',color:'#60a5fa'},
 {min:51,max:68,name:'运动健将',desc:'看起来有点东西，别惹急他',emoji:'💪',color:'#facc15'},
 {min:69,max:82,name:'不好惹',desc:'气场两米八，注意保持距离',emoji:'🕶️',color:'#fb923c'},
 {min:83,max:94,name:'道上狠人',desc:'凶起来连自己都怕',emoji:'🔪',color:'#f87171'},
 {min:95,max:100,name:'终极战力',desc:'传说中的存在，建议快跑！',emoji:'👹',color:'#e879f9'}
];
function tierOf(v){for(const t of TIERS){if(v>=t.min&&v<=t.max)return t}return TIERS[0]}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setStatus(t){$('status').textContent=t}
function setBadge(t,on){const b=$('badge');b.textContent=t;b.style.display=on?'block':'none'}

/* ---------- 模型 ---------- */
async function ensureModel(){
  if(detector)return;
  setStatus('加载人脸识别模型…');
  let mp;
  try{mp=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs')}
  catch(e){setStatus('识别库加载失败：请检查网络后刷新');throw e}
  const {FilesetResolver,FaceDetector}=mp;
  try{
    const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm');
    let made=false;
    for(const delegate of ['GPU','CPU']){
      try{detector=await FaceDetector.createFromOptions(vision,{baseOptions:{modelAssetPath:'./blaze_face_short_range.tflite',delegate},runningMode:'VIDEO',minDetectionConfidence:.4,minSuppressionThreshold:.3});made=true;break}catch(e){}
    }
    if(!made)throw new Error('模型初始化失败');
    setStatus('模型就绪，正在开启摄像头…');
  }catch(e){setStatus('模型加载失败：'+esc(e.message));throw e}
}

/* ---------- 摄像头 ---------- */
async function openStream(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const [w,h]=st.res.split('x').map(Number);
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:st.facing,width:{ideal:w},height:{ideal:h}},audio:false});
  video.srcObject=stream;
  await new Promise((res,rej)=>{video.onloadedmetadata=()=>res();video.onerror=e=>rej(e)});
  await video.play();
  canvas.width=video.videoWidth||w;canvas.height=video.videoHeight||h;
  $('placeholder').style.display='none';
  smooth={x:.5,y:.5};tracks=[];
}
async function start(){
  try{
    await ensureModel();await openStream();camOn=true;
    $('btnStart').style.display='none';$('btnStop').style.display='';
    setStatus('摄像头已开启');
    cancelAnimationFrame(raf);loop();
  }catch(e){
    console.error(e);
    setStatus(e.name==='NotAllowedError'?'未获得摄像头权限：请在地址栏允许后重试'
      :e.name==='NotFoundError'?'未找到摄像头设备'
      :e.name==='NotReadableError'?'摄像头被其他程序占用，请关闭后重试'
      :('启动失败：'+e.message));
  }
}
function stop(){
  camOn=false;cancelAnimationFrame(raf);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  video.srcObject=null;ctx.clearRect(0,0,canvas.width,canvas.height);
  $('placeholder').style.display='flex';$('btnStart').style.display='';$('btnStop').style.display='none';
  setBadge('',false);hidePower();setStatus('已关闭');
}
async function restartStream(){
  if(!camOn)return;
  try{await openStream();setStatus('摄像头参数已更新')}catch(e){stop();setStatus('切换失败：'+esc(e.message))}
}

/* ---------- 跟踪 + 战力 ---------- */
function trackFaces(){
  const W=video.videoWidth,H=video.videoHeight,used=new Set(),next=[];
  for(const d of faces){
    const bb=d.boundingBox;if(!bb)continue;
    const cx=bb.originX+bb.width/2,cy=bb.originY+bb.height/2;
    let best=-1,bd=bb.width*1.2;
    for(let i=0;i<tracks.length;i++){
      if(used.has(i))continue;
      const dx=tracks[i].cx-cx,dy=tracks[i].cy-cy;
      const dist=Math.hypot(dx,dy);
      if(dist<bd){bd=dist;best=i}
    }
    let t;
    if(best>=0){used.add(best);t=tracks[best]}
    else{
      const base=hashStr('pw'+(idSeq++))%94+1; /* 1..94 基础分 */
      t={id:idSeq,cx,cy,score:0,shown:0,base,newFace:true};
    }
    t.cx=cx;t.cy=cy;t.bb={x:bb.originX,y:bb.originY,w:bb.width,h:bb.height};
    const sizeBonus=Math.max(0,Math.round((bb.width/W)*40)-4);
    t.score=Math.max(1,Math.min(100,t.base+sizeBonus));
    next.push(t);
  }
  tracks=next;
  return tracks;
}
function draw(){
  const W=video.videoWidth,H=video.videoHeight;
  if(!W||!H){ctx.clearRect(0,0,canvas.width,canvas.height);return}
  canvas.width=W;canvas.height=H;
  let primary=null,pa=0;
  for(const t of tracks){const a=t.bb.w*t.bb.h;if(a>pa){pa=a;primary=t}}
  let crop={x:0,y:0,w:W,h:H};
  if(st.follow&&primary){
    const cx=primary.bb.x+primary.bb.w/2,cy=primary.bb.y+primary.bb.h/2;
    smooth.x+=(cx/W-smooth.x)*.18;smooth.y+=(cy/H-smooth.y)*.18;
    const cw=W/st.zoom,ch=H/st.zoom;
    crop.w=cw;crop.h=ch;
    crop.x=Math.max(0,Math.min(W-cw,smooth.x*W-cw/2));
    crop.y=Math.max(0,Math.min(H-ch,smooth.y*H-ch/2));
  }
  ctx.save();ctx.clearRect(0,0,W,H);
  if(st.mirror){ctx.translate(W,0);ctx.scale(-1,1)}
  ctx.drawImage(video,crop.x,crop.y,crop.w,crop.h,0,0,W,H);
  ctx.restore();
  const sx=W/crop.w,sy=H/crop.h;
  const dt=16;
  for(const t of tracks){
    if(st.power){
      if(t.shown<t.score)t.shown=Math.min(t.score,t.shown+t.score*dt*.9/1000);
      else t.newFace=false;
    }
    const rx=(t.bb.x-crop.x)*sx,rw=t.bb.w*sx,ry=(t.bb.y-crop.y)*sy,rh=t.bb.h*sy;
    const x1=st.mirror?W-rx-rw:rx,y1=ry,w=rw,h=rh;
    const col=st.power?tierOf(Math.round(t.shown||1)).color:'#22d3ee';
    ctx.strokeStyle=col;ctx.lineWidth=Math.max(2,W/500);
    ctx.beginPath();
    const L=Math.max(14,W/28);
    corner(x1,y1,L,1);corner(x1+w,y1,L,2);corner(x1,y1+h,L,3);corner(x1+w,y1+h,L,4);
    ctx.stroke();
    const cxv=x1+w/2,cyv=y1+h/2;
    ctx.beginPath();ctx.arc(cxv,cyv,Math.max(8,W/90),0,7);ctx.strokeStyle=col;ctx.globalAlpha=.85;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;
    if(st.power){
      const val=Math.round(t.shown),tier=tierOf(val);
      ctx.fillStyle='rgba(6,12,24,.72)';roundRect(ctx,x1,y1-24,Math.max(84,w),20,6);ctx.fill();
      ctx.fillStyle=tier.color;ctx.font='bold 13px sans-serif';ctx.textAlign='left';
      ctx.fillText(tier.emoji+' 战力 '+val,x1+5,y1-9);
    }else{
      const sc=d=>{};
      ctx.fillStyle='rgba(6,20,30,.6)';roundRect(ctx,x1,y1-22,Math.max(60,w),18,6);ctx.fill();
      ctx.fillStyle='#7df3ff';ctx.font='12px sans-serif';ctx.textAlign='left';
      ctx.fillText('人脸 '+(faces.length),x1+4,y1-8);
    }
  }
  if(st.follow&&primary){
    const cxv=st.mirror?W-((primary.bb.x+primary.bb.w/2-crop.x)*sx):((primary.bb.x+primary.bb.w/2-crop.x)*sx);
    const cyv=(primary.bb.y+primary.bb.h/2-crop.y)*sy;
    ctx.strokeStyle='rgba(248,113,113,.9)';ctx.lineWidth=2;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.moveTo(cxv-18,cyv);ctx.lineTo(cxv+18,cyv);ctx.moveTo(cxv,cyv-18);ctx.lineTo(cxv,cyv+18);ctx.stroke();ctx.setLineDash([]);
  }
  setBadge('识别到 '+tracks.length+' 张脸'+(st.power?' · 战力扫描中':' · 人脸追踪中'),tracks.length>0);
  if(frameN%9===0)updatePower(primary,W);
  frameN++;
}
function updatePower(t,W){
  if(!camOn||!st.power||!t){hidePower();return}
  const card=$('powerCard');
  const val=Math.min(t.score,Math.max(1,Math.round(t.shown)));
  const tier=tierOf(val);
  const done=t.shown>=t.score;
  $('pnum').textContent=done?t.score:val;
  $('ptier').textContent=tier.emoji+' '+tier.name;
  $('ptier').style.color=tier.color;
  $('pdesc').textContent=tier.desc;
  $('pfill').style.width=(t.shown/t.score*100)+'%';
  $('pfill').style.background='linear-gradient(90deg,'+tier.color+',#fff)';
  card.style.borderColor=tier.color;
  card.style.boxShadow='0 0 26px '+tier.color+'55';
  card.classList.toggle('scan',!done);
  card.style.display='block';
}
function hidePower(){const c=$('powerCard');c.style.display='none'}

/* ---------- 主循环 ---------- */
async function loop(){
  if(!camOn)return;
  if(video.readyState>=2&&detector){
    const now=performance.now();
    if(now-lastDetect>40){
      try{const res=await detector.detectForVideo(video,now);faces=(res&&res.detections)||[];lastDetect=now}catch(e){}
    }
  }
  trackFaces();
  draw();
  raf=requestAnimationFrame(loop);
}

/* ---------- 控件 ---------- */
$('btnStart').addEventListener('click',start);
$('btnStop').addEventListener('click',stop);
$('btnShot').addEventListener('click',()=>{if(!camOn)return;canvas.toBlob(b=>{if(!b)return;const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='战力检测-'+new Date().toISOString().replace(/[:T]/g,'-').slice(0,19)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)},'image/png')});
$('btnFs').addEventListener('click',()=>{const s=$('stage');document.fullscreenElement?document.exitFullscreen():s.requestFullscreen&&s.requestFullscreen()});
$('selCam').addEventListener('change',e=>{st.facing=e.target.value;restartStream()});
$('selRes').addEventListener('change',e=>{st.res=e.target.value;restartStream()});
$('ckMirror').addEventListener('change',e=>{st.mirror=e.target.checked});
$('ckFollow').addEventListener('change',e=>{st.follow=e.target.checked;$('zoomWrap').style.display=st.follow?'':'none'});
$('ckPower').addEventListener('change',e=>{st.power=e.target.checked;if(!st.power)hidePower()});
$('selZoom').addEventListener('change',e=>{st.zoom=parseFloat(e.target.value)});

/* ---------- 辅助绘制 ---------- */
function corner(x,y,L,k){ctx.moveTo(x,y);if(k===1||k===2)ctx.lineTo(x+L,y);else ctx.lineTo(x-L,y);ctx.moveTo(x,y);if(k===1||k===3)ctx.lineTo(x,y+L);else ctx.lineTo(x,y-L)}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* ---------- 等级表 ---------- */
(function initLegend(){
  const g=$('legendGrid');
  g.innerHTML=TIERS.map(t=>'<div><span class="lcolor" style="background:'+t.color+'"></span><span class="lname">'+t.emoji+' '+t.name+'</span><span class="lrange">'+t.min+'~'+t.max+'</span></div>').join('');
})();
</script>
</body>
</html>
