<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人脸追踪摄像头</title>
<style>
  :root{--bg:#0f1222;--card:#1a1f38;--ink:#eef0ff;--sub:#9aa3c7;--accent:#6366f1;--accent2:#8b5cf6;--ok:#22c55e;--line:#2a3050}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(1200px 600px at 20% -10%,#2a2f66 0%,var(--bg) 55%);color:var(--ink);min-height:100vh;padding-bottom:70px}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;background:rgba(15,18,34,.8);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 18px}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.25rem}
  .brand b{font-size:1.1rem}
  .brand small{display:block;color:var(--sub);font-size:.72rem}
  #status{margin-left:auto;font-size:.8rem;color:var(--sub);text-align:right;max-width:46%}
  .wrap{max-width:1000px;margin:0 auto;padding:16px}
  .stage{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 10px 40px rgba(0,0,0,.45);border:1px solid var(--line)}
  #cam{width:100%;height:100%;object-fit:contain;display:block}
  #placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#5a6287;font-size:.95rem;text-align:center;padding:20px}
  #placeholder .big{font-size:2.6rem}
  .badge{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.55);color:#cffcdf;padding:4px 12px;border-radius:99px;font-size:.78rem;display:none;border:1px solid rgba(34,197,94,.4)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
  .btn{border:1px solid var(--line);background:#232946;color:var(--ink);padding:9px 15px;border-radius:10px;font-size:.88rem;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{filter:brightness(1.15)}
  .btn.green{background:linear-gradient(135deg,#16a34a,#22c55e);border:none;color:#fff;font-weight:600}
  .btn.red{background:linear-gradient(135deg,#dc2626,#ef4444);border:none;color:#fff}
  .btn.violet{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff}
  label.ctl{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--sub)}
  select,input[type=checkbox]{accent-color:var(--accent)}
  select{background:#232946;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:.85rem}
  .hint{color:var(--sub);font-size:.76rem;line-height:1.6;background:#141830;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:12px}
  @media(max-width:640px){.panel{gap:8px 12px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">🎯</div>
  <div class="brand"><b>人脸追踪摄像头</b><small>自动识别 · 锁定跟随 · 拍照</small></div>
  <div id="status">未开启</div>
</header>

<main class="wrap">
  <div class="stage" id="stage">
    <canvas id="cam"></canvas>
    <div id="placeholder"><div class="big">📷</div>点击下方「开启摄像头」开始<br><span style="font-size:.78rem;color:#454d70">需允许浏览器使用摄像头权限</span></div>
    <div class="badge" id="badge"></div>
  </div>

  <div class="panel">
    <button class="btn green" id="btnStart">▶ 开启摄像头</button>
    <button class="btn red" id="btnStop" style="display:none">■ 关闭</button>
    <button class="btn violet" id="btnShot">📸 拍照</button>
    <button class="btn" id="btnFs">⛶ 全屏</button>
    <label class="ctl">摄像头
      <select id="selCam"><option value="user">前置</option><option value="environment">后置</option></select>
    </label>
    <label class="ctl">画质
      <select id="selRes">
        <option value="640x480">流畅 640×480</option>
        <option value="1280x720" selected>高清 1280×720</option>
        <option value="1920x1080">超清 1920×1080</option>
      </select>
    </label>
    <label class="ctl"><input type="checkbox" id="ckMirror" checked> 镜像</label>
    <label class="ctl"><input type="checkbox" id="ckFollow"> 🎯 自动追踪人脸</label>
    <label class="ctl" id="zoomWrap" style="display:none">跟随强度
      <select id="selZoom"><option value="1.4">1.4×</option><option value="1.8" selected>1.8×</option><option value="2.4">2.4×</option></select>
    </label>
  </div>

  <div class="hint">
    💡 <b>使用提示：</b>需在 <b>https</b> 网页或本机调试环境使用（GitHub Pages 已满足）。若在微信里打不开摄像头，请点右上角 ⋯ →「在浏览器打开」。勾选「自动追踪」后画面会以人脸为中心自动缩放跟随；「镜像」用于自拍习惯。拍照图片自动下载保存。
  </div>
</main>


<script>
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('cam'),ctx=canvas.getContext('2d');
const video=document.createElement('video');video.muted=true;video.playsInline=true;video.autoplay=true;
let detector=null,stream=null,camOn=false,raf=0,lastDetect=0;
let faces=[],smooth={x:0.5,y:0.5},statusTimer=0;

const st={facing:'user',res:'1280x720',mirror:true,follow:false,zoom:1.8};
function setStatus(t){$('status').textContent=t}
function setBadge(t,on){const b=$('badge');b.textContent=t;b.style.display=on?'block':'none'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ---------- 模型加载 ---------- */
async function ensureModel(){
  if(detector)return;
  setStatus('加载人脸识别模型…');
  let mp;
  try{ mp=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs'); }
  catch(e){ setStatus('识别库加载失败：请检查网络后刷新页面'); throw e; }
  const {FilesetResolver, FaceDetector}=mp;
  try{
    const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm');
    let made=false;
    for(const delegate of ['GPU','CPU']){
      try{
        detector=await FaceDetector.createFromOptions(vision,{
          baseOptions:{modelAssetPath:'./blaze_face_short_range.tflite',delegate},
          runningMode:'VIDEO',minDetectionConfidence:0.4,minSuppressionThreshold:0.3
        });made=true;break;
      }catch(e){/* 尝试下一个 delegate */}
    }
    if(!made)throw new Error('模型初始化失败');
    setStatus('模型就绪，正在开启摄像头…');
  }catch(e){setStatus('模型加载失败：'+esc(e.message));throw e}
}

/* ---------- 摄像头 ---------- */
async function openStream(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const [w,h]=st.res.split('x').map(Number);
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:st.facing,width:{ideal:w},height:{ideal:h}},audio:false});
  video.srcObject=stream;
  await new Promise((res,rej)=>{video.onloadedmetadata=()=>res();video.onerror=e=>rej(e)});
  await video.play();
  canvas.width=video.videoWidth||w;canvas.height=video.videoHeight||h;
  $('placeholder').style.display='none';
  smooth={x:0.5,y:0.5};
}

async function start(){
  try{
    await ensureModel();
    await openStream();
    camOn=true;
    $('btnStart').style.display='none';$('btnStop').style.display='';
    setStatus('摄像头已开启');
    cancelAnimationFrame(raf);loop();
  }catch(e){
    console.error(e);
    let m=e.name==='NotAllowedError'?'未获得摄像头权限：请在地址栏允许使用摄像头后重试'
      :e.name==='NotFoundError'?'未找到摄像头设备'
      :e.name==='NotReadableError'?'摄像头被其他程序占用，请关闭后重试'
      :('启动失败：'+e.message);
    setStatus(m);
  }
}
function stop(){
  camOn=false;cancelAnimationFrame(raf);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  video.srcObject=null;ctx.clearRect(0,0,canvas.width,canvas.height);
  $('placeholder').style.display='flex';$('btnStart').style.display='';$('btnStop').style.display='none';
  setBadge('',false);setStatus('已关闭');
}
async function restartStream(){
  if(!camOn)return;
  try{await openStream();setStatus('摄像头参数已更新')}catch(e){stop();setStatus('切换失败：'+esc(e.message))}
}

/* ---------- 检测 + 绘制 ---------- */
function pickLargest(){
  let best=null,ba=0;
  for(const d of faces){
    const bb=d.boundingBox;if(!bb)continue;
    const a=bb.width*bb.height;if(a>ba){ba=a;best=d}
  }
  return best;
}
function draw(){
  const W=video.videoWidth,H=video.videoHeight;
  if(!W||!H){ctx.clearRect(0,0,canvas.width,canvas.height);return}
  canvas.width=W;canvas.height=H;
  const primary=pickLargest();
  let crop={x:0,y:0,w:W,h:H};
  if(st.follow&&primary){
    const bb=primary.boundingBox;
    const cx=bb.originX+bb.width/2, cy=bb.originY+bb.height/2;
    smooth.x+=(cx/W-smooth.x)*0.18;smooth.y+=(cy/H-smooth.y)*0.18;
    const cw=W/st.zoom,ch=H/st.zoom;
    crop.w=cw;crop.h=ch;
    crop.x=Math.max(0,Math.min(W-cw,smooth.x*W-cw/2));
    crop.y=Math.max(0,Math.min(H-ch,smooth.y*H-ch/2));
  }
  /* 画画面（支持镜像） */
  ctx.save();ctx.clearRect(0,0,W,H);
  if(st.mirror){ctx.translate(W,0);ctx.scale(-1,1)}
  ctx.drawImage(video,crop.x,crop.y,crop.w,crop.h,0,0,W,H);
  ctx.restore();
  const sx=W/crop.w,sy=H/crop.h;
  const mapX=x=>st.mirror?W-(x*sx):x*sx;
  const mapY=y=>y*sy;
  /* 画框 */
  for(const d of faces){
    const bb=d.boundingBox;if(!bb)continue;
    const rx=(bb.originX-crop.x)*sx, rw=bb.width*sx, ry=(bb.originY-crop.y)*sy, rh=bb.height*sy;
    const x1=st.mirror?W-rx-rw:rx, y1=ry, w=rw, h=rh;
    ctx.strokeStyle='rgba(34,211,238,.95)';ctx.lineWidth=Math.max(2,W/500);
    ctx.beginPath();
    const L=Math.max(14,W/28);
    corner(x1,y1,L,1);corner(x1+w,y1,L,2);corner(x1,y1+h,L,3);corner(x1+w,y1+h,L,4);
    ctx.stroke();
    const cxv=x1+w/2,cyv=y1+h/2;
    ctx.beginPath();ctx.arc(cxv,cyv,Math.max(8,W/90),0,7);ctx.strokeStyle='rgba(34,211,238,.85)';ctx.lineWidth=2;ctx.stroke();
    const score=d.categories&&d.categories[0]?d.categories[0].score:0;
    ctx.fillStyle='rgba(6,20,30,.6)';roundRect(ctx,x1,y1-22,Math.max(60,w),18,6);ctx.fill();
    ctx.fillStyle='#7df3ff';ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText('人脸 '+(score*100).toFixed(0)+'%',x1+4,y1-8);
  }
  if(st.follow&&primary){
    const bb=primary.boundingBox;
    const ccx=(bb.originX+bb.width/2-crop.x)*sx, ccy=(bb.originY+bb.height/2-crop.y)*sy;
    const cxv=st.mirror?W-ccx:ccx, cyv=ccy;
    ctx.strokeStyle='rgba(248,113,113,.9)';ctx.lineWidth=2;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.moveTo(cxv-18,cyv);ctx.lineTo(cxv+18,cyv);ctx.moveTo(cxv,cyv-18);ctx.lineTo(cxv,cyv+18);ctx.stroke();ctx.setLineDash([]);
  }
  setBadge('已识别 '+faces.length+' 张脸'+(st.follow&&primary?' · 追踪中':''),faces.length>0);
}
function corner(x,y,L,k){ctx.moveTo(x,y);if(k===1||k===2)ctx.lineTo(x+L,y);else ctx.lineTo(x-L,y);ctx.moveTo(x,y);if(k===1||k===3)ctx.lineTo(x,y+L);else ctx.lineTo(x,y-L)}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

async function loop(){
  if(!camOn)return;
  if(video.readyState>=2&&detector){
    const now=performance.now();
    if(now-lastDetect>40){
      try{const res=await detector.detectForVideo(video,now);faces=(res&&res.detections)||[];lastDetect=now}
      catch(e){}
    }
  }
  draw();
  raf=requestAnimationFrame(loop);
}

/* ---------- 控件 ---------- */
$('btnStart').addEventListener('click',start);
$('btnStop').addEventListener('click',stop);
$('btnShot').addEventListener('click',()=>{
  if(!camOn)return;
  canvas.toBlob(b=>{if(!b)return;const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='人脸追踪-'+new Date().toISOString().replace(/[:T]/g,'-').slice(0,19)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)},'image/png');
});
$('btnFs').addEventListener('click',()=>{const s=$('stage');if(document.fullscreenElement)document.exitFullscreen();else s.requestFullscreen&&s.requestFullscreen()});
$('selCam').addEventListener('change',e=>{st.facing=e.target.value;restartStream()});
$('selRes').addEventListener('change',e=>{st.res=e.target.value;restartStream()});
$('ckMirror').addEventListener('change',e=>{st.mirror=e.target.checked});
$('ckFollow').addEventListener('change',e=>{st.follow=e.target.checked;$('zoomWrap').style.display=st.follow?'':'none'});
$('selZoom').addEventListener('change',e=>{st.zoom=parseFloat(e.target.value)});
</script>
</body>
</html>
